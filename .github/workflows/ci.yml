name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The build's Gradle toolchain asks for Java 21; installing it here means the
      # toolchain resolver finds it instead of downloading one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Every test runs without Kafka or Docker: the topologies run in TopologyTestDriver
      # with an in-memory Schema Registry, and the evaluation test uses a small CSV fixture
      # rather than the 478 MB dataset.
      - name: Build and run all tests
        run: ./gradlew build --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
