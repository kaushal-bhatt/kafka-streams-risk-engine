name: risk-engine

services:

  # Kafka in KRaft mode — no ZooKeeper. Single broker, single controller.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    container_name: risk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Stage 6 turns on exactly-once. The app's transaction.timeout.ms must stay under
      # this or it refuses to start.
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    hostname: schema-registry
    container_name: risk-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      # Adding an optional field must not break a running consumer. Stage 6 proves it.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "BACKWARD"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Topics are created explicitly rather than auto-created, because partition counts
  # are part of the design: the transaction stream and the card table must have the
  # same count or the KStream-KTable join silently produces nothing.
  init-topics:
    image: confluentinc/cp-kafka:7.7.1
    container_name: risk-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: risk-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 8089 rather than the usual 8080/8090, which are the ports most likely to be taken
      # by something else on a dev machine. Override with KAFKA_UI_PORT=... if 8089 is too.
      - "${KAFKA_UI_PORT:-8089}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "risk-engine"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      DYNAMIC_CONFIG_ENABLED: "true"

  # Only needed from stage 5 (CDC). Start it with:  docker compose --profile cdc up
  postgres:
    image: postgres:16-alpine
    container_name: risk-postgres
    profiles: ["cdc"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: payments
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d payments"]
      interval: 10s
      timeout: 5s
      retries: 10
