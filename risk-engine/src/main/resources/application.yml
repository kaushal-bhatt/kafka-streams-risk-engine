spring:
  application:
    name: risk-engine

server:
  # Not 8080: that is the port most likely to already be taken on a dev machine.
  port: ${SERVER_PORT:8088}

risk:
  application-id: risk-engine
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  state-dir: ${STREAMS_STATE_DIR:./state}
  # Each instance advertises where it can be reached, so from stage 3 an Interactive
  # Query can be routed to whichever instance owns the key.
  application-server: ${APPLICATION_SERVER:localhost:8088}
  num-standby-replicas: ${NUM_STANDBY_REPLICAS:1}
  # exactly_once_v2 or at_least_once. The latency probe measures the difference.
  processing-guarantee: ${PROCESSING_GUARANTEE:exactly_once_v2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.apache.kafka.streams: INFO
    com.kaushal.riskengine: DEBUG
